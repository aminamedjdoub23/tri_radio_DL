seed: 42
device: auto

paths:
  data_root: data/raw
  output_dir: outputs_quick
  mlflow_uri: mlruns_quick
  openi_csv: data/openi/openi_prepared.csv

chestmnist:
  medmnist_size: 64
  size: 64
  batch_size: 32
  num_workers: 0
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  threshold: 0.5
  max_samples:
    train: 512
    val: 128
    test: 128

models:
  transfer_name: resnet18
  vit_name: vit_tiny_patch16_224
  pretrained: false

autoencoder:
  epochs: 1
  lr: 0.001
  batch_size: 32
  normal_strategy: no_finding
  anomaly_percentile: 95

openi:
  image_size: 64
  batch_size: 16
  epochs: 1
  lr: 0.001
  max_tfidf_features: 2000
  text_column: report
  image_column: image_path
  label_columns: []

mlflow:
  experiment_name: tri_radiologique_chestmnist_quick
