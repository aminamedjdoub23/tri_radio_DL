seed: 42
device: auto

paths:
  data_root: data/raw
  output_dir: outputs_openi_multimodal
  mlflow_uri: mlruns_openi_multimodal
  openi_csv: data/openi/openi_prepared.csv

chestmnist:
  medmnist_size: 64
  size: 224
  batch_size: 16
  num_workers: 0
  epochs: 20
  lr: 0.0001
  weight_decay: 0.0001
  threshold: 0.5

models:
  transfer_name: densenet121
  vit_name: vit_tiny_patch16_224
  pretrained: true

autoencoder:
  epochs: 20
  lr: 0.0001
  batch_size: 16
  normal_strategy: no_finding
  anomaly_percentile: 95

early_stopping:
  patience: 7
  monitor: val_auc
  min_delta: 0.001

openi:
  image_size: 224
  batch_size: 16
  epochs: 20
  lr: 0.0001
  max_tfidf_features: 2000
  text_column: report
  image_column: image_path
  drop_missing_images: false
  label_columns:
    - Atelectasis
    - Cardiomegaly
    - Effusion
    - Pleural

mlflow:
  experiment_name: openi_multimodal_official
