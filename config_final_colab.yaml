seed: 42
device: auto

paths:
  data_root: data/raw
  output_dir: outputs_final
  mlflow_uri: mlruns_final
  openi_csv: data/openi/openi_prepared.csv

chestmnist:
  medmnist_size: 64
  size: 224
  batch_size: 32        # era 16 — T4 gestisce 32 senza problemi
  num_workers: 2        # era 0 — Colab ha CPU multipli disponibili
  epochs: 20
  lr: 0.0001
  weight_decay: 0.0001
  threshold: 0.5
  max_samples:
    train: null
    val: null
    test: null

models:
  transfer_name: densenet121
  vit_name: vit_tiny_patch16_224
  pretrained: true

autoencoder:
  epochs: 20
  lr: 0.0001
  batch_size: 32        # era 16
  normal_strategy: no_finding
  anomaly_percentile: 95

early_stopping:
  patience: 7
  monitor: val_auc
  min_delta: 0.001

openi:
  image_size: 224
  batch_size: 32        # era 16
  epochs: 20
  lr: 0.0001
  max_tfidf_features: 2000
  text_column: report
  image_column: image_path
  drop_missing_images: false
  label_columns: []

mlflow:
  experiment_name: tri_radiologique_final